<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Check-In</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Check-In</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-grid>
    <ion-row>
      <ion-col>
        <ion-text>Your Friends asked you for an <strong>Check-In</strong>. Please confirm, if he was
          in the training.
        </ion-text>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col>
        <ion-list [inset]="true">
          <ion-item *ngFor="let checkInRequest of requestedCheckIns" (click)="openActionDialogForItem(checkInRequest)">
            <ion-item style="width: 100%">
              <ion-label slot="start">{{ checkInRequest.name }}</ion-label>
              <ion-label slot="end" style="color:grey">{{checkInRequest.date}}</ion-label>
            </ion-item>
          </ion-item>
        </ion-list>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col>
        <ion-button (click)="onCreateDoc()">Create Doc</ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>
  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button>
      <ion-icon name="cog-outline"></ion-icon>
    </ion-fab-button>
    <ion-fab-list side="top">
      <ion-fab-button (click)="onLogOut()">
        <ion-icon name="log-out-outline"></ion-icon>
      </ion-fab-button>
    </ion-fab-list>
  </ion-fab>
</ion-content>
