<ion-content [fullscreen]="true">
  <ion-card class="anmiation">
    <img alt="Silhouette of mountains" src="assets/login.jpg"/>
    <ion-card-header>
      <ion-card-title>Login</ion-card-title>
      <ion-card-subtitle>Are you ready for the best Form of yourself?</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <ion-grid>
        <ion-row>
          <ion-col size-sm="12" offset-sm="5" class="ion-text-center ion-no-padding">
            <ion-item style="width: 100%">
              <ion-input label="E-Mail" label-placement="floating" [(ngModel)]="email"
                         placeholder="max.mustermann@test.de"></ion-input>
            </ion-item>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col size-sm="12" offset-sm="5" class="ion-text-center ion-no-padding">
            <ion-item style="width: 100%">
              <ion-input label="Password" type="password" label-placement="floating" [(ngModel)]="password"
                         placeholder="Your Password"></ion-input>
            </ion-item>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col size-sm="6" offset-sm="3" class="ion-text-center ion-padding">
            <ion-button class="ion-margin-start" expand="block" (click)="onLogin()">Login</ion-button>
            <ion-button style="font-size: small" fill="clear" expand="block" (click)="onNoAccountClicked()">No Account?
              - Register Now!
            </ion-button>
          </ion-col>
        </ion-row>
      </ion-grid>
    </ion-card-content>
  </ion-card>
</ion-content>
